function renderLog(){
  const blk=activeBlock(), w=currentWeek();
  const seen={}; const days=[];
  blk.days.forEach((d,di)=>{
    if(!d.items) return;
    const rows=[];
    d.items.forEach(raw=>{
      const x=resolve(raw);
      if(x.sets<2||x.noload||!x.key||seen[x.key]) return;
      seen[x.key]=1; rows.push(x);
    });
    if(rows.length) days.push({tab:d.tab,name:d.name,rows:rows});
  });

  const row = x => {
    const cur=getW(x.key), rec=wts[x.key];
    const hist=rec?(rec.hist||[]).concat([rec.w]):[];
    let spark='';
    if(hist.length>1){
      const mn=Math.min.apply(null,hist), mx=Math.max.apply(null,hist), rg=(mx-mn)||1, W=52,H=18;
      const pts=hist.map((v,i)=>[(i/(hist.length-1))*W, H-((v-mn)/rg)*(H-4)-2]);
      spark='<svg class="spark" viewBox="0 0 '+W+' '+H+'"><polyline fill="none" stroke="var(--good)" '+
        'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="'+
        pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/></svg>';
    }
    return '<div class="wrow"><div class="wrname">'+x.name+
      (x.unit?'<em>'+x.unit+'</em>':'')+spark+'</div>'+
      (editKey===x.key
        ? '<div class="winput inline"><input id="setw" type="number" inputmode="decimal" placeholder="lb" autofocus>'+
          '<button id="setgo">Save</button></div>'
        : cur? '<div class="wctl"><button data-w="'+x.key+'" data-d="-1">−</button><i>'+cur+'</i>'+
            '<button data-w="'+x.key+'" data-d="1">+</button></div>'
          : '<button class="wpend tapme" data-set="'+x.key+'">Tap to set</button>')+'</div>';
  };

  const anySet=Object.keys(seen).some(k=>getW(k)!==null);

  stage.innerHTML=
   '<div class="panel"><h2>Block '+blk.id+' weights</h2>'+
   '<p>Only the lifts in your current block. Each one is set the first time you reach it, then the app moves it for you.</p>'+
   (anySet?'':'<p class="empty" style="margin-top:11px">Nothing set yet. You can tap through and set them all now, or leave it — each one will ask on your first working set.</p>')+
   '</div>'+
   days.map(d=>'<div class="panel"><h2>'+d.tab+' · '+d.name.replace(' · ',' ')+'</h2>'+
     d.rows.map(row).join('')+'</div>').join('')+
   '<div class="panel"><h2>How the weight moves</h2>'+
   '<p><strong>After your last set</strong> the app asks how it felt. That answer is the whole system:</p>'+
   '<p><strong>All reps, felt solid</strong> → up next time, automatically.<br>'+
   '<strong>Got them, barely</strong> → same weight. Earn it.<br>'+
   '<strong>Missed reps</strong> → same weight. Twice in a row drops it 10% so you build back.</p>'+
   '<p><strong>Deload weeks</strong> (9 and 18) show 60% automatically. <strong>Block 3</strong> holds weights steady on purpose — while eating less, keeping the load IS the win.</p></div>';

  stage.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.w, inc=(EX[k].inc||5)*(+b.dataset.d);
    setW(k, Math.max(5,(getW(k)||0)+inc)); renderLog();
  }));
  stage.querySelectorAll('[data-set]').forEach(b=>b.addEventListener('click',()=>{
    editKey=b.dataset.set; renderLog();
    const el=document.getElementById('setw'); if(el&&el.focus) el.focus();
  }));
  const sg=document.getElementById('setgo');
  if(sg) sg.addEventListener('click',()=>{
    const v=document.getElementById('setw').value;
    if(v) setW(editKey,v);
    editKey=null; renderLog();
  });
}

function recap(w){
  if(w<1) return '';
  const dn=weekDone(w);
  let vol=0; for(let i=0;i<6;i++) if(vols[w+'|'+i]) vol+=vols[w+'|'+i];
  let prevVol=0; for(let i=0;i<6;i++) if(vols[(w-1)+'|'+i]) prevVol+=vols[(w-1)+'|'+i];
  const delta = prevVol? Math.round((vol-prevVol)/prevVol*100) : null;
  const added=strengthAdded();
  const blk=blockFor(w), nextBlk=blockFor(w+1);
  const changing = nextBlk.id!==blk.id;
  const nextDeload = nextBlk.deload===w+1;

  let verdict,tone;
  if(dn>=5){ verdict='Strong week. This is what the six-month version looks like.'; tone='good'; }
  else if(dn===4){ verdict='Good week. Four is the number that keeps the program working.'; tone='good'; }
  else if(dn===3){ verdict='Light week. One more session next week puts you back on plan — nothing to make up.'; tone='warn'; }
  else if(dn>0){ verdict='Rough week. It happens. Do not repay it — take the next session on the calendar.'; tone='warn'; }
  else { verdict='Nothing logged. Start with one session. Not a fresh start, just the next one.'; tone='warn'; }

  return '<div class="recap '+tone+'"><div class="rechead"><span class="lbl">Week '+w+' recap</span>'+
   '<span class="recbadge">'+dn+' of 6</span></div>'+
   '<p class="recverdict">'+verdict+'</p>'+
   '<div class="recgrid">'+
     '<div><b>'+(vol?Math.round(vol/1000)+'k':'—')+'</b><i>lb lifted</i></div>'+
     '<div><b>'+(delta!==null?(delta>0?'+':'')+delta+'%':'—')+'</b><i>vs last week</i></div>'+
     '<div><b>+'+added+'</b><i>lb added total</i></div>'+
   '</div>'+
   '<div class="recnext"><span class="lbl">Next week</span><p>'+
     (changing? 'Block '+nextBlk.id+' starts — '+nextBlk.name+'. New exercises and a different rep range.'
      : nextDeload? 'Deload. Two sets at 60%. The app drops your weights for you.'
      : 'Same sessions. Clear all your sets and the weights go up on their own.')+
   '</p></div></div>';
}

function progressPanel(){
  const rows=Object.keys(wts).filter(k=>EX[k]&&wts[k].start!==undefined&&wts[k].w>wts[k].start)
    .map(k=>({k:k,n:EX[k].n,from:wts[k].start,to:wts[k].w,
              pct:(wts[k].w-wts[k].start)/wts[k].start}))
    .sort((a,b)=>b.pct-a.pct).slice(0,8);
  if(!rows.length) return '<div class="panel"><h2>Strength progress</h2>'+
    '<p class="empty">Fills in as you clear sessions. Every lift you add weight to shows up here with how far it has moved — this is the page to open on the weeks the mirror is not cooperating.</p></div>';
  const max=Math.max.apply(null,rows.map(r=>r.pct));
  return '<div class="panel"><h2>Strength progress</h2>'+
   '<p>Where each lift started and where it is now.</p><div class="pbars">'+
   rows.map(r=>'<div class="pbar"><div class="pbtop"><b>'+r.n+'</b>'+
     '<span>'+r.from+' → '+r.to+' lb</span></div>'+
     '<div class="ptrack"><span style="width:'+Math.round(r.pct/max*100)+'%"></span></div>'+
     '<i>+'+Math.round(r.pct*100)+'%</i></div>').join('')+'</div></div>';
}

function renderBody(){
  const last=body[body.length-1];
  return '<div class="panel"><h2>Monthly check</h2>'+
   '<p>Weekly weight is water and food timing. Once a month, same morning conditions, is the only measurement worth reacting to.</p>'+
   '<div class="winput" style="margin-top:14px"><input id="bw" type="number" inputmode="decimal" placeholder="Weight">'+
   '<input id="bwa" type="number" inputmode="decimal" placeholder="Waist">'+
   '<button id="bsave">Log</button></div>'+
   (body.length? '<div style="margin-top:16px">'+body.slice(-8).map(e=>
     '<div class="logrow"><b>'+e.d+'</b><span>'+e.w+' lb · '+e.wa+'&Prime;</span></div>').join('')+'</div>'
    : '<p class="empty" style="margin-top:13px">Nothing logged yet. Weight and waist, first of the month, before eating. Take a photo in the same light while you are at it — that is the measurement that actually tells you if this is working.</p>')+
   '</div>';
}

/* ============ setup view ============ */
function renderSetup(){
  stage.innerHTML=
   '<div class="panel"><h2>Program start date</h2>'+
   '<p>Set this to the Monday you begin. Everything — which block you are in, which week, the tracker grid — runs off this date.</p>'+
   '<input class="datefield" type="date" id="sd" value="'+startISO+'">'+
   '<div class="phases" id="ov"><button class="phase'+(blockOverride===null?' on':'')+'" data-b="0">Auto</button>'+
   BLOCKS.map(b=>'<button class="phase'+(blockOverride===b.id?' on':'')+'" data-b="'+b.id+'">Block '+b.id+'</button>').join('')+'</div>'+
   '<p class="empty" style="margin-top:10px">Auto picks the block from today\'s date. Override only if you are repeating or skipping ahead.</p></div>'+
   '<div class="panel on"><div class="tagline">Start here</div><h2>Three things and you are running</h2>'+
   '<ol><li>Tap <b>Start</b> on the Today screen. Do what it says, top to bottom.</li>'+
   '<li>The first time a lift asks <b>what weight will you use</b>, guess low — or tap "work it out for me". You are asked once. It climbs on its own after that.</li>'+
   '<li>Tap the numbered squares as you finish each set. The rest timer starts itself.</li></ol>'+
   '<p style="margin-top:12px">That is the whole app. Swipe left and right to move between exercises. Everything else is optional.</p></div>'+
   '<div class="panel"><h2>Your data</h2>'+
   '<p>Saved automatically in '+(storageState.layers.length||2)+' places every time you tap. Nothing to export, nothing to back up.</p>'+
   '<details class="fold" style="margin-top:12px;background:var(--night)"><summary>Storage detail</summary><div class="foldbody">'+
   '<div class="slayers">'+
     ['browser','database','cloud'].map(l=>'<div class="slayer'+(storageState.layers.indexOf(l)>-1?' on':'')+'">'+
       '<span></span>'+(l==='browser'?'Browser store':l==='database'?'On-device database':'Cloud copy')+'</div>').join('')+
   '</div>'+
   '<p class="'+(storageState.persisted?'okline':'warnline')+'">'+
     (storageState.persisted
       ? 'Protected storage granted — your phone will not clear this to free up space.'
       : 'Protected storage not granted yet. Open the app from your home screen icon a few times and iOS usually grants it.')+
   '</p>'+
   '</div></details>'+
   (storageState.snaps.length? '<div class="snaps"><span class="lbl">Automatic restore points</span>'+
     storageState.snaps.map(k=>{ const t=new Date(+String(k).split(':')[1]);
       return '<button class="snapbtn" data-snap="'+k+'">'+MONTHS[t.getMonth()].slice(0,3)+' '+t.getDate()+
         ', '+pad(t.getHours())+':'+pad(t.getMinutes())+'</button>'; }).join('')+
     '<p class="empty" style="margin-top:10px">Kept automatically. Only touch these if something looks wrong.</p></div>':'')+
   '</div>'+
   '<div class="panel"><div class="tagline">Moving the app</div><h2>Transfer code</h2>'+
   '<p>Your data lives with the exact address you opened the app from. Move to a home-screen link or a new phone and it does not follow. This code carries it.</p>'+
   '<p><strong>On the old copy:</strong> tap Copy. <strong>On the new one:</strong> paste it in and tap Restore. Everything comes across — weights, history, start date, measurements.</p>'+
   '<textarea class="codebox" id="codeout" readonly>'+makeCode()+'</textarea>'+
   '<button class="codebtn" id="copycode">Copy my code</button>'+
   '<textarea class="codebox" id="codein" placeholder="Paste a transfer code here"></textarea>'+
   '<button class="codebtn ghost" id="restorecode">Restore from code</button>'+
   '<p class="empty" id="codemsg" style="margin-top:11px">Also worth copying somewhere safe once you are a few weeks in — it is a complete backup in one line of text.</p>'+
   '</div>'+
   '<div class="panel"><h2>Personalise</h2>'+
   '<p>Optional. Leave these blank if you plan to host this at a public link.</p>'+
   '<input class="datefield" id="nm" type="text" placeholder="Your name (for the greeting)" value="'+who+'">'+
   '<input class="datefield" id="pl" type="text" placeholder="Gym name (for the timeline)" value="'+(place==='the gym'?'':place)+'">'+
   '</div>'+
   '<div class="panel"><h2>Add to home screen</h2>'+
   '<p><strong>iPhone.</strong> This must be Safari — the option does not exist in Chrome on iOS. Open this page in Safari, tap the share icon at the bottom of the screen (the square with the arrow pointing up), scroll down that list past the app row, tap <strong>Add to Home Screen</strong>, then tap Add in the top right.</p>'+
   '<p><strong>Android.</strong> Open in Chrome, tap the three-dot menu at the top right, tap <strong>Add to Home screen</strong>, then Install.</p>'+
   '<p class="empty" style="margin-top:10px">It opens full screen with no browser bars, which is the point — you are launching this half-awake.</p></div>'+
   '<div class="panel"><h2>Before you start</h2>'+
   '<p>400 ml water with electrolytes on waking. Another 200–300 ml before the heat. Drink again after your shower.</p></div>'+
   '<div class="panel"><h2>How this works</h2><ol>'+
   '<li>Opens on today, in whichever block your start date puts you in.</li>'+
   '<li>Tap set numbers as you finish each set. The rest timer starts itself.</li>'+
   '<li>Session clock counts toward 30 minutes so you make 7:30.</li>'+
   '<li>Weight and reps fields appear on the main lifts and carry between sessions.</li>'+
   '<li>Mark the session done at the end — that feeds the Track grid.</li>'+
   '<li>Sauna and every interval segment have their own countdown.</li></ol></div>'+
   '<div class="panel"><h2>Skip the heat if</h2>'+
   '<p>You slept badly, you are dehydrated, you feel run-down, or you are sick. Cool-to-lukewarm shower after — never ice cold straight out.</p></div>';

  stage.querySelectorAll('[data-snap]').forEach(b=>b.addEventListener('click',async()=>{
    if(await restoreSnap(b.dataset.snap)){ buildRail(); selectDay(dayIdx); renderSetup(); }
  }));
  const cc=document.getElementById('copycode');
  if(cc) cc.addEventListener('click',()=>{
    const t=document.getElementById('codeout'), m=document.getElementById('codemsg');
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t.value); }
      else { t.focus(); t.select(); document.execCommand('copy'); }
      if(m){ m.textContent='Copied. Paste it into the other copy of the app and tap Restore.'; m.className='okline'; }
      if(navigator.vibrate) navigator.vibrate(20);
    }catch(e){
      if(m){ m.textContent='Could not copy automatically — tap and hold the box above to select and copy.'; m.className='warnline'; }
    }
  });
  const rc=document.getElementById('restorecode');
  if(rc) rc.addEventListener('click',()=>{
    const v=document.getElementById('codein').value, m=document.getElementById('codemsg');
    if(!v){ if(m){m.textContent='Paste a code into the box first.';m.className='warnline';} return; }
    if(readCode(v)){
      if(navigator.vibrate) navigator.vibrate([40,50,40]);
      buildRail(); dayIdx=currentWeek()>=1?todayIdx():0; selectDay(dayIdx); renderSetup();
      const m2=document.getElementById('codemsg');
      if(m2){ m2.textContent='Restored. Check the start date and your weights.'; m2.className='okline'; }
    } else if(m){ m.textContent='That code did not read. Copy the whole thing, including the GS1- at the front.'; m.className='warnline'; }
  });
  const nmEl=document.getElementById('nm');
  if(nmEl) nmEl.addEventListener('change',e=>{ who=e.target.value.trim().slice(0,24); save(); });
  const plEl=document.getElementById('pl');
  if(plEl) plEl.addEventListener('change',e=>{ place=e.target.value.trim().slice(0,40)||'the gym'; save(); });
  document.getElementById('sd').addEventListener('change',e=>{
    if(e.target.value){ startISO=e.target.value; save(); buildRail(); renderSetup(); }
  });
  stage.querySelectorAll('[data-b]').forEach(b=>b.addEventListener('click',()=>{
    const v=+b.dataset.b; blockOverride = v===0?null:v;
    buildRail(); if(dayIdx>=activeBlock().days.length) dayIdx=0;
    renderSetup();
  }));
}

// swipe left/right to move through the session — one-handed, sweaty-thumb friendly
(function(){
  let x0=null,y0=null;
  document.addEventListener('touchstart',e=>{
    if(view!=='session'||e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(x0===null||view!=='session') return;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    x0=null;
    if(Math.abs(dx)>62 && Math.abs(dx)>Math.abs(dy)*1.8){
      go(dx<0?1:-1);
      if(navigator.vibrate) navigator.vibrate(12);
    }
  },{passive:true});
})();
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>setView(t.dataset.view)));
loadState().then(()=>{
  buildRail();
  // Before week 1, "today" is meaningless — show the first session instead.
  dayIdx = currentWeek()>=1 ? todayIdx() : 0;
  selectDay(dayIdx); setView('today');
});
</script>
</body>
</html>
