<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Temper">
<title>Temper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;560;600;640;680&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0C10; --surface:#14171D; --raised:#1C2027; --deep:#0E1116;
  --hair:rgba(255,255,255,.055); --hair2:rgba(255,255,255,.10);
  --ink:#F4F6FA; --muted:#98A1AF; --dim:#616A78;
  --accent:#FF9F45; --accent-2:#E4763F; --cool:#7C8BE0;
  --good:#4CD196; --miss:#EC6A80;
  --sp:clamp(18px,5vw,22px);
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5; letter-spacing:-.011em;
  font-feature-settings:'cv05','cv08','ss03';
  min-height:100vh; padding-bottom:calc(88px + env(safe-area-inset-bottom));
  overscroll-behavior:none;
}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--sp)}
.rail[hidden] + main{padding-top:calc(env(safe-area-inset-top) + 14px)}
.rail + main{padding-top:2px}
h1,h2,h3{font-weight:640;letter-spacing:-.035em;line-height:1.08}
.lbl{font-size:11px;font-weight:560;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em}

/* ── day rail ─────────────────────────────── */
.rail{display:flex;gap:6px;overflow-x:auto;padding:calc(12px + env(safe-area-inset-top)) var(--sp) 8px;scrollbar-width:none;
  position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 78%,transparent)}
.rail::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;padding:8px 15px;border-radius:100px;border:none;background:var(--surface);
  color:var(--dim);font-family:inherit;font-size:12.5px;font-weight:560;letter-spacing:.02em;
  cursor:pointer;transition:background .2s,color .2s}
.day[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:620}
.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── session header ───────────────────────── */
.head{padding-bottom:14px}
.metarow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.eyebrow{font-size:11px;font-weight:560;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.clock{font-size:12.5px;font-weight:560;color:var(--dim);font-variant-numeric:tabular-nums}
.clock.live{color:var(--cool)} .clock.over{color:var(--accent)}
.title{font-size:30px;font-weight:660;letter-spacing:-.04em;line-height:1.05}
.bar{height:2px;background:var(--hair);margin-top:16px;border-radius:2px;position:relative;overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0;border-radius:2px;
  background:linear-gradient(90deg,var(--cool),var(--accent-2) 62%,var(--accent));
  transition:width .4s cubic-bezier(.4,0,.2,1)}

/* ── today ────────────────────────────────── */
.hero{padding:4px 0 0}
.wordmark{font-size:12px;font-weight:640;letter-spacing:.28em;color:var(--dim);
  text-transform:uppercase;margin-bottom:22px}
.herotop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.greet{font-size:14px;color:var(--muted);font-weight:450}
.herodate{font-size:14px;color:var(--dim);margin-top:1px}
.ringwrap{position:relative;flex:0 0 auto;width:54px;height:54px}
.ring{display:block}
.ringtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  letter-spacing:-.04em}
.ringtxt b{font-size:17px;font-weight:640}
.ringtxt i{font-size:10.5px;font-style:normal;color:var(--dim)}
.urgent{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:7px 14px;
  border-radius:100px;background:rgba(255,159,69,.10);color:var(--accent);
  font-size:12.5px;font-weight:560}
.urgent .dot{width:5px;height:5px;border-radius:50%;background:currentColor;
  animation:pulse 2.4s ease-in-out infinite}
.urgent.cool{background:rgba(124,139,224,.11);color:var(--cool)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.herotitle{font-size:clamp(40px,11vw,52px);font-weight:680;letter-spacing:-.05em;
  line-height:.96;margin-top:18px}
.headline{font-size:15px;line-height:1.5;color:var(--muted);margin-top:14px;max-width:34ch}
.herosub{font-size:15px;line-height:1.55;color:var(--muted);margin-top:14px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin-top:20px}
.chip{background:var(--surface);border-radius:100px;padding:7px 13px;font-size:11.5px;
  font-weight:560;color:var(--muted);letter-spacing:.01em}
.chip.cool{color:var(--cool)} .chip.hot{color:var(--accent)} .chip.good{color:var(--good)}
.startbtn{width:100%;margin-top:22px;padding:19px;border-radius:16px;border:none;cursor:pointer;
  background:var(--accent);color:#241100;font-family:inherit;font-size:16px;font-weight:640;
  letter-spacing:-.01em;transition:transform .12s}
.startbtn:active{transform:scale(.985)}
.startbtn.ghost{background:var(--surface);color:var(--ink)}
.shortbtn{width:100%;margin-top:9px;padding:15px;border-radius:14px;cursor:pointer;
  background:transparent;border:none;color:var(--dim);font-family:inherit;font-size:13.5px}

.quote{margin-top:18px;padding:22px;border-radius:var(--r);background:var(--surface)}
.quote p{font-size:18px;font-weight:560;line-height:1.35;letter-spacing:-.025em;color:var(--ink)}
.quote cite{display:block;margin-top:10px;font-style:normal;font-size:11.5px;color:var(--dim);
  letter-spacing:.08em;text-transform:uppercase;font-weight:560}

.gain{margin-top:14px;background:var(--surface);border-radius:var(--r);padding:20px;
  display:flex;align-items:center;gap:18px}
.gainnum{font-size:38px;font-weight:680;line-height:.9;letter-spacing:-.05em;color:var(--good);
  font-variant-numeric:tabular-nums;flex:0 0 auto}
.gainnum span{font-size:14px;margin-left:3px;letter-spacing:0}
.gaintxt b{display:block;font-size:14px;font-weight:600}
.gaintxt p{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.45}

.comeback{margin-top:14px;background:var(--surface);border-radius:var(--r);padding:20px}
.comeback b{font-size:16px;font-weight:620;letter-spacing:-.02em;display:block;margin-bottom:7px}
.comeback p{font-size:14px;line-height:1.55;color:var(--muted)}
.comeback.small{padding:17px 20px}
.preflight{margin-top:16px;background:var(--surface);border-radius:var(--r);padding:22px}
.preflight .lbl{color:var(--accent);display:block;margin-bottom:10px}
.preflight h3{font-size:20px;font-weight:640;margin-bottom:16px}
.preflight ol{margin:0;padding-left:19px;color:var(--muted);font-size:14px;line-height:1.6}
.preflight li{margin-bottom:12px} .preflight li:last-child{margin-bottom:0}
.preflight li b{color:var(--ink);font-weight:600}

.glance{margin-top:16px;background:var(--surface);border-radius:var(--r);padding:8px 20px 14px}
.glance .lbl{display:block;padding:14px 0 6px}
.grow{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--hair)}
.grow:first-of-type{border-top:none}
.grow.tap{width:100%;background:none;border:none;color:var(--ink);border-top:1px solid var(--hair);
  font-family:inherit;cursor:pointer;text-align:left}
.grow.tap:first-of-type{border-top:none}
.gnum{width:22px;height:22px;border-radius:7px;background:var(--raised);color:var(--dim);
  font-size:11px;font-weight:620;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.gnum.heat{color:var(--accent)}
.gbody{flex:1;min-width:0}
.gname{display:block;color:var(--ink);font-size:15px;font-weight:450;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsch{display:block;font-size:13px;color:var(--dim);margin-top:2px}
.gsch b{color:var(--accent);font-weight:560}

.tomorrow{margin-top:14px;background:var(--surface);border-radius:var(--r);padding:18px 20px}
.tomorrow .lbl{display:block;margin-bottom:9px}
.tmrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.tmrow b{font-size:16px;font-weight:560;letter-spacing:-.02em;color:var(--muted)}
.tmrow span{font-size:13px;color:var(--dim);flex:0 0 auto}
.quickrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.quick{background:var(--surface);border:none;border-radius:16px;padding:17px 10px;cursor:pointer;
  font-family:inherit;text-align:center}
.quick b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.quick i{display:block;font-style:normal;font-size:11.5px;color:var(--dim);margin-top:4px}
.timeline{margin-top:14px;background:var(--surface);border-radius:var(--r);padding:18px 20px}
.tl{display:flex;align-items:baseline;gap:14px;padding:7px 0;font-size:14px;color:var(--dim)}
.tlt{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:560;width:50px;flex:0 0 auto;font-size:13.5px}
.tl.now{color:var(--ink)} .tl.now .tlt{color:var(--accent)}

/* ── exercise card ────────────────────────── */
.now{background:var(--surface);border-radius:var(--r);padding:22px 20px;margin-top:14px}
.nowtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.step{font-size:11px;font-weight:560;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  background:none;border:none;font-family:inherit;cursor:pointer;padding:0}
.blocktag{font-size:11px;font-weight:560;letter-spacing:.05em;color:var(--dim);text-align:right}
.exname{font-size:29px;font-weight:660;letter-spacing:-.042em;line-height:1.06;margin-top:16px}
.scheme{font-size:21px;font-weight:600;color:var(--accent);margin-top:7px;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}

.diagram{margin-top:18px;background:var(--deep);border-radius:14px;padding:12px 10px 8px}
.diagram svg{width:100%;height:auto;display:block}
.dcap{display:flex;justify-content:space-around;margin-top:4px}
.dcap span{font-size:10.5px;font-weight:560;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}

details.howto{margin-top:20px;padding-top:18px;border-top:1px solid var(--hair)}
details.howto summary{list-style:none;cursor:pointer;font-size:11px;font-weight:560;
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim);display:flex;
  align-items:center;justify-content:space-between;margin-bottom:14px}
details.howto summary::-webkit-details-marker{display:none}
details.howto summary::after{content:'Show';color:var(--cool);letter-spacing:.02em;text-transform:none;font-size:12.5px}
details.howto[open] summary::after{content:'Hide'}
.howto ol{margin:0;padding:0;list-style:none;counter-reset:st}
.howto li{position:relative;padding-left:30px;margin-bottom:13px;font-size:14.5px;line-height:1.52;
  color:var(--ink);counter-increment:st}
.howto li:last-child{margin-bottom:0}
.howto li::before{content:counter(st);position:absolute;left:0;top:1px;width:20px;height:20px;
  border-radius:7px;background:var(--raised);color:var(--accent);font-size:11px;font-weight:620;
  display:flex;align-items:center;justify-content:center}
.cue{font-size:14px;line-height:1.55;color:var(--muted);margin-top:18px;padding:15px 17px;
  background:var(--deep);border-radius:14px}
.watch{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;margin-top:14px;
  background:var(--raised);color:var(--cool);border:none;border-radius:14px;padding:15px;
  text-decoration:none;font-size:13.5px;font-weight:560;font-family:inherit}

.sets{display:flex;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap}
.setlbl{font-size:11px;font-weight:560;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  width:100%;margin-bottom:2px}
.pip{width:48px;height:48px;border-radius:14px;border:none;background:var(--raised);color:var(--dim);
  cursor:pointer;font-family:inherit;font-size:16px;font-weight:620;transition:.16s;
  font-variant-numeric:tabular-nums}
.pip:active{transform:scale(.93)}
.pip.on{background:var(--accent);color:#241100}
.pip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wsetup{margin-top:20px;background:var(--deep);border-radius:16px;padding:19px}
.wq{font-size:18px;font-weight:620;letter-spacing:-.025em}
.whelp{font-size:13.5px;line-height:1.55;color:var(--muted);margin-top:8px}
.winput{display:flex;gap:9px;align-items:center;margin-top:14px}
.winput input{flex:1;min-width:0;background:var(--raised);border:none;border-radius:13px;
  padding:16px 14px;color:var(--ink);font-family:inherit;font-size:20px;font-weight:620;
  font-variant-numeric:tabular-nums}
.winput input:focus{outline:2px solid var(--accent);outline-offset:-2px}
.winput span{color:var(--dim);font-size:12px;font-weight:560}
.winput button{background:var(--accent);border:none;color:#241100;border-radius:13px;padding:16px 20px;
  font-family:inherit;font-size:14.5px;font-weight:640;cursor:pointer}
.winput.inline{margin-top:0;flex:0 0 auto;width:164px}
.winput.inline input{padding:11px 12px;font-size:16px}
.winput.inline button{padding:11px 15px;font-size:13px}
.helpme{width:100%;margin-top:11px;background:transparent;border:none;color:var(--cool);
  border-radius:12px;padding:13px;font-size:13.5px;cursor:pointer;font-family:inherit}
.estbox{margin-top:12px;background:var(--raised);border-radius:14px;padding:17px}
.estbox p{font-size:14px;color:var(--ink)}
.esthelp{font-size:12.5px;color:var(--dim);margin-top:11px;line-height:1.5}
.cancel{width:100%;margin-top:10px;background:transparent;border:none;color:var(--dim);
  border-radius:12px;padding:13px;font-size:13.5px;cursor:pointer;font-family:inherit}

.wbig{margin-top:20px;background:var(--deep);border-radius:16px;padding:19px;
  display:flex;align-items:center;gap:17px}
.wnum{font-size:44px;font-weight:680;line-height:.88;letter-spacing:-.055em;color:var(--accent);
  font-variant-numeric:tabular-nums;flex:0 0 auto}
.wnum span{font-size:15px;margin-left:4px;letter-spacing:0}
.wmeta{flex:1;min-width:0}
.wevery{font-size:13px;font-weight:600;color:var(--ink)}
.wnote{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.45}
.wedit{background:var(--raised);border:none;color:var(--muted);border-radius:11px;padding:10px 13px;
  font-size:12px;font-weight:560;cursor:pointer;flex:0 0 auto;font-family:inherit}

.reps{margin-top:18px;background:var(--deep);border-radius:16px;padding:17px 18px}
.repshead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.vol{font-size:13px;font-weight:600;color:var(--good);font-variant-numeric:tabular-nums}
.reprow{display:flex;align-items:center;gap:10px;padding:7px 0}
.rlbl{font-size:13px;color:var(--dim);width:44px;flex:0 0 auto}
.rbtn{width:36px;height:36px;border-radius:11px;border:none;background:var(--raised);color:var(--ink);
  font-size:17px;cursor:pointer;line-height:1;flex:0 0 auto;font-family:inherit}
.rnum{font-size:19px;font-weight:620;min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.rtgt{font-size:11.5px;color:var(--dim);margin-left:auto}

.prompt{margin-top:20px;padding-top:18px;border-top:1px solid var(--hair)}
.pq{font-size:17px;font-weight:620;letter-spacing:-.025em;margin-bottom:13px}
.pbtn{display:block;width:100%;margin-bottom:8px;padding:17px;border-radius:14px;cursor:pointer;
  border:none;background:var(--raised);color:var(--ink);font-family:inherit;font-size:14.5px;
  font-weight:450;text-align:left}
.pbtn.up{color:var(--good);font-weight:560}
.pbtn.dn{color:var(--dim)}
.pbtn:last-child{margin-bottom:0}
.rated{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(76,209,150,.10);border-radius:14px;padding:17px}
.rated b{font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--good)}
.undo{background:transparent;border:none;color:var(--dim);border-radius:10px;padding:8px 12px;
  font-size:12px;font-weight:560;cursor:pointer;font-family:inherit;flex:0 0 auto}

.rest{margin-top:16px;border-radius:16px;background:rgba(255,159,69,.09);padding:16px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.rest[hidden]{display:none}
.restlbl{font-size:11px;font-weight:560;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.restnum{font-size:36px;font-weight:680;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.045em}
.skip{background:rgba(255,255,255,.06);border:none;color:var(--muted);border-radius:11px;
  padding:11px 16px;cursor:pointer;font-size:13px;font-weight:560;font-family:inherit}
.heatbtn{width:100%;margin-top:18px;padding:18px;border-radius:16px;cursor:pointer;border:none;
  background:var(--accent);color:#241100;font-family:inherit;font-size:16px;font-weight:640}

.checks{margin-top:20px;padding-top:18px;border-top:1px solid var(--hair)}
.checks h3{font-size:11px;font-weight:560;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);margin-bottom:6px}
.check{display:flex;align-items:center;gap:13px;padding:11px 0;cursor:pointer;background:none;
  border:none;width:100%;text-align:left;color:var(--muted);font-size:14.5px;font-family:inherit}
.box{width:21px;height:21px;border-radius:7px;background:var(--raised);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
.check.on{color:var(--ink)} .check.on .box{background:var(--good);color:#062015}

.done{width:100%;margin-top:14px;padding:19px;border-radius:16px;cursor:pointer;border:none;
  background:var(--good);color:#062015;font-family:inherit;font-size:16px;font-weight:640}
.done.marked{background:var(--raised);color:var(--good)}
.summary{margin-top:14px;background:var(--surface);border-radius:var(--r);padding:20px}
.summary .lbl{display:block;margin-bottom:14px}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sumgrid div{background:var(--deep);border-radius:14px;padding:16px 8px;text-align:center}
.sumgrid b{display:block;font-size:24px;font-weight:660;letter-spacing:-.045em;color:var(--accent);
  font-variant-numeric:tabular-nums}
.sumgrid i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);margin-top:6px}

.next{margin-top:12px;background:var(--surface);border-radius:16px;padding:16px 18px;border:none;
  display:flex;align-items:center;gap:15px;cursor:pointer;text-align:left;width:100%;font-family:inherit}
.nextlbl{font-size:10px;font-weight:560;letter-spacing:.14em;text-transform:uppercase;color:var(--cool);
  writing-mode:vertical-rl;transform:rotate(180deg);flex:0 0 auto}
.nextbody{flex:1;min-width:0}
.nextname{display:block;font-size:17px;font-weight:560;line-height:1.15;letter-spacing:-.028em;
  color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nextscheme{display:block;font-size:12.5px;color:var(--dim);margin-top:3px}
.chev{color:var(--dim);font-size:20px;flex:0 0 auto}
.nav{display:flex;gap:9px;margin-top:14px}
.nav button{flex:1;padding:17px;border-radius:16px;cursor:pointer;border:none;background:var(--surface);
  color:var(--ink);font-family:inherit;font-size:14.5px;font-weight:560}
.nav button.go{background:var(--ink);color:var(--bg);font-weight:640;flex:1.9}
.nav button:disabled{opacity:.3;cursor:default}

.jumplist{margin-top:14px;background:var(--surface);border-radius:var(--r);padding:8px;
  max-height:52vh;overflow-y:auto}
.jrow{display:flex;align-items:center;gap:13px;width:100%;padding:14px 13px;background:none;
  border:none;border-radius:13px;cursor:pointer;text-align:left;font-family:inherit;color:var(--muted)}
.jrow.on{background:var(--raised);color:var(--ink)}
.jn{width:21px;height:21px;border-radius:7px;background:var(--raised);color:var(--dim);font-size:11px;
  font-weight:620;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.jrow.on .jn{background:var(--accent);color:#241100}
.jname{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jsch{font-size:12px;color:var(--dim);flex:0 0 auto}
.shortbar{background:rgba(124,139,224,.11);border-radius:14px;padding:13px 16px;margin-top:14px;
  font-size:13px;color:var(--cool);display:flex;align-items:center;justify-content:space-between;gap:11px}
.shortbar button{background:rgba(255,255,255,.07);border:none;color:var(--cool);border-radius:10px;
  padding:8px 12px;font-size:12px;font-weight:560;cursor:pointer;font-family:inherit;flex:0 0 auto}

/* ── panels & data ────────────────────────── */
.panel{background:var(--surface);border-radius:var(--r);padding:24px 22px;margin-top:14px}
.panel h2{font-size:20px;font-weight:640;margin-bottom:12px}
.panel p{font-size:14.5px;line-height:1.62;color:var(--muted);margin-bottom:11px}
.panel p:last-child{margin-bottom:0}
.panel strong{color:var(--ink);font-weight:600}
.panel em{color:var(--muted);font-style:italic}
.panel ol,.panel ul{margin:11px 0 0 19px;color:var(--muted);font-size:14.5px;line-height:1.75}
.panel.on{box-shadow:inset 0 0 0 1px rgba(255,159,69,.35)}
.tagline{font-size:11px;font-weight:560;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);margin-bottom:8px}
.secthead{display:flex;align-items:baseline;gap:12px;margin:30px 2px 6px}
.secthead span{font-size:19px;font-weight:640;letter-spacing:-.035em;color:var(--ink)}
.secthead i{font-style:normal;font-size:12.5px;color:var(--dim)}
.empty{color:var(--dim);font-size:14px;line-height:1.62}
.okline{color:var(--good)!important;font-size:13px!important;margin-top:13px!important}
.warnline{color:var(--accent)!important;font-size:13px!important;margin-top:13px!important}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface);border-radius:16px;padding:17px 8px;text-align:center}
.statn{font-size:26px;font-weight:660;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.045em}
.statl{font-size:10px;font-weight:500;color:var(--dim);margin-top:8px;line-height:1.3}

.grid{margin-top:18px}
.ghead{display:grid;grid-template-columns:40px repeat(7,1fr);gap:5px;margin-bottom:8px}
.ghead span{font-size:10px;font-weight:560;color:var(--dim);text-align:center}
.wk{display:grid;grid-template-columns:40px repeat(7,1fr);gap:5px;margin-bottom:5px;align-items:center;
  position:relative}
.wklbl{font-size:11px;font-weight:560;color:var(--dim);font-variant-numeric:tabular-nums}
.wk.now{background:rgba(255,159,69,.06);border-radius:10px;padding:4px;margin:0 -4px 5px}
.wk.now .wklbl{color:var(--accent)}
.cell{aspect-ratio:1;border-radius:9px;border:none;background:var(--raised);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim);
  font-weight:620;padding:0;font-family:inherit}
.cell.rest{background:transparent;box-shadow:inset 0 0 0 1px var(--hair);cursor:default}
.cell.pre{background:transparent;box-shadow:inset 0 0 0 1px var(--hair);opacity:.4;cursor:default}
.cell.future{background:rgba(255,255,255,.035)}
.cell.open{background:var(--raised)}
.cell.did{background:var(--good);color:#062015}
.cell.miss{background:var(--miss);color:#2A0710}
.cell.today{box-shadow:0 0 0 2px var(--accent)}
.deloadrow::before{content:'';position:absolute;left:-9px;top:3px;bottom:3px;width:2px;
  background:var(--cool);border-radius:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px}
.legend div{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim)}
.sw{width:12px;height:12px;border-radius:4px;background:var(--raised)}
.gridtoggle{width:100%;margin-top:16px;background:var(--raised);border:none;border-radius:14px;
  padding:14px;color:var(--muted);font-size:13.5px;cursor:pointer;font-family:inherit}

.logrow{display:flex;justify-content:space-between;gap:12px;padding:14px 0;
  border-bottom:1px solid var(--hair);font-size:14.5px}
.logrow:last-child{border-bottom:none}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;
  border-bottom:1px solid var(--hair)}
.wrow:last-child{border-bottom:none}
.wrname{font-size:14.5px;color:var(--ink);display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.wrname em{font-style:normal;font-size:11.5px;color:var(--dim)}
.wpend{font-size:12.5px;color:var(--dim);flex:0 0 auto}
.tapme{background:var(--raised);border:none;border-radius:11px;padding:9px 14px;color:var(--cool);
  font-size:12.5px;font-weight:560;cursor:pointer;font-family:inherit;flex:0 0 auto}
.wctl{display:flex;align-items:center;gap:9px}
.wctl button{width:36px;height:36px;border-radius:11px;border:none;background:var(--raised);
  color:var(--ink);font-size:17px;cursor:pointer;line-height:1;font-family:inherit}
.wctl i{font-style:normal;min-width:50px;text-align:right;color:var(--accent);font-size:18px;
  font-weight:640;font-variant-numeric:tabular-nums}
.spark{width:56px;height:20px;margin-left:8px;vertical-align:middle;opacity:.9}
.pbars{margin-top:16px}
.pbar{margin-bottom:18px} .pbar:last-child{margin-bottom:0}
.pbtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.pbtop b{font-size:14.5px;font-weight:450;color:var(--ink)}
.pbtop span{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
.ptrack{height:6px;border-radius:6px;background:var(--deep);overflow:hidden}
.ptrack span{display:block;height:100%;border-radius:6px;background:var(--good)}
.pbar i{display:block;font-style:normal;font-size:11.5px;color:var(--good);margin-top:6px;font-weight:560}

.recap{margin-top:14px;background:var(--surface);border-radius:var(--r);padding:22px}
.rechead{display:flex;align-items:center;justify-content:space-between;gap:11px;margin-bottom:12px}
.recbadge{font-size:12.5px;font-weight:620;color:var(--accent);font-variant-numeric:tabular-nums}
.recverdict{font-size:17px;font-weight:560;line-height:1.4;letter-spacing:-.022em;color:var(--ink)}
.recgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.recgrid div{background:var(--deep);border-radius:14px;padding:15px 8px;text-align:center}
.recgrid b{display:block;font-size:20px;font-weight:660;letter-spacing:-.04em;color:var(--accent);
  font-variant-numeric:tabular-nums}
.recgrid i{display:block;font-style:normal;font-size:10px;color:var(--dim);margin-top:6px}
.recnext{margin-top:18px;padding-top:16px;border-top:1px solid var(--hair)}
.recnext .lbl{display:block;margin-bottom:7px}
.recnext p{font-size:13.5px;line-height:1.55;color:var(--muted)}

/* ── plan ─────────────────────────────────── */
.planhead{padding:6px 0 2px}
.arc{margin-top:24px}
.arcbar{display:flex;gap:4px;height:46px;position:relative}
.arcseg{border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;
  font-weight:560;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);background:var(--surface)}
.arcseg.b1{background:rgba(124,139,224,.14)}
.arcseg.b2{background:rgba(178,133,190,.14)}
.arcseg.b3{background:rgba(255,159,69,.16)}
.arcseg.on{color:var(--ink)}
.arcpin{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--accent);border-radius:2px}
.arcpin i{position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;
  background:var(--accent)}
.arcnums{display:flex;justify-content:space-between;margin-top:10px;font-size:10.5px;color:var(--dim);
  font-weight:560}
.bcard{margin-top:14px;background:var(--surface);border-radius:var(--r);padding:22px}
.bcard.on{box-shadow:inset 0 0 0 1px rgba(255,159,69,.35)}
.bhead{display:flex;align-items:center;gap:15px}
.bnum{font-size:24px;font-weight:680;color:var(--dim);letter-spacing:-.06em;flex:0 0 auto}
.bcard.on .bnum{color:var(--accent)}
.btitle{font-size:21px;font-weight:640;letter-spacing:-.035em}
.bweeks{font-size:12.5px;color:var(--dim);margin-top:2px}
.bnow{margin-left:auto;font-size:10px;font-weight:620;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent)}
.bgoal{font-size:14.5px;line-height:1.6;color:var(--muted);margin-top:16px}
.bstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.bstats div{background:var(--deep);border-radius:13px;padding:14px 8px;text-align:center}
.bstats b{display:block;font-size:17px;font-weight:640;letter-spacing:-.035em}
.bstats i{display:block;font-style:normal;font-size:9.5px;color:var(--dim);margin-top:5px;
  letter-spacing:.05em;text-transform:uppercase}
.beat{margin-top:18px;padding-top:16px;border-top:1px solid var(--hair)}
.beat .lbl{display:block;margin-bottom:7px}
.beat p{font-size:13.5px;line-height:1.6;color:var(--muted)}
.numgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.numcell{background:var(--deep);border-radius:14px;padding:16px 14px}
.numcell b{display:block;font-size:22px;font-weight:660;letter-spacing:-.045em;color:var(--accent);
  font-variant-numeric:tabular-nums}
.numcell i{display:block;font-style:normal;font-size:12.5px;color:var(--ink);margin-top:4px;font-weight:450}
.numcell em{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:3px}
.fold{margin-top:9px;background:var(--surface);border-radius:16px;overflow:hidden}
.fold summary{padding:19px 21px;cursor:pointer;list-style:none;font-size:15.5px;font-weight:560;
  letter-spacing:-.022em;display:flex;align-items:center;justify-content:space-between;gap:12px}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:'+';color:var(--accent);font-size:19px;font-weight:400;flex:0 0 auto;
  line-height:1}
.fold[open] summary::after{content:'−'}
.foldbody{padding:0 21px 20px}
.foldbody p{font-size:14px;line-height:1.65;color:var(--muted);margin-bottom:11px}
.foldbody p:last-child{margin-bottom:0}
.foldbody strong{color:var(--ink);font-weight:600}
.foldbody ol,.foldbody ul{margin:10px 0 13px 19px;color:var(--muted);font-size:14px;line-height:1.7}
.foldbody li{margin-bottom:7px}
.foldbody b{color:var(--ink);font-weight:600}

/* ── setup ────────────────────────────────── */
.phases{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.phase{padding:11px 15px;border-radius:12px;border:none;background:var(--raised);color:var(--muted);
  cursor:pointer;font-size:13px;font-weight:560;font-family:inherit}
.phase.on{background:var(--accent);color:#241100}
.datefield{width:100%;background:var(--raised);border:none;border-radius:13px;padding:16px 14px;
  color:var(--ink);font-size:16px;margin-top:12px;font-family:inherit}
.datefield:focus{outline:2px solid var(--accent);outline-offset:-2px}
.slayers{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.slayer{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);
  background:var(--raised);border-radius:100px;padding:9px 14px}
.slayer span{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.slayer.on{color:var(--good)} .slayer.on span{background:var(--good)}
.snaps{margin-top:18px;padding-top:16px;border-top:1px solid var(--hair)}
.snaps .lbl{display:block;margin-bottom:11px}
.snapbtn{display:inline-block;margin:0 7px 7px 0;background:var(--raised);border:none;color:var(--muted);
  border-radius:11px;padding:10px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.codebox{width:100%;margin-top:13px;background:var(--deep);border:none;border-radius:13px;padding:15px;
  color:var(--dim);font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5;
  min-height:76px;resize:none;word-break:break-all}
.codebox:focus{outline:2px solid var(--accent);outline-offset:-2px}
.codebtn{width:100%;margin-top:10px;padding:16px;border-radius:14px;cursor:pointer;border:none;
  background:var(--accent);color:#241100;font-family:inherit;font-size:14.5px;font-weight:640}
.codebtn.ghost{background:var(--raised);color:var(--ink)}

/* ── tab bar ──────────────────────────────── */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
  background:rgba(10,12,16,.86);backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border-top:1px solid var(--hair);padding:11px 8px calc(11px + env(safe-area-inset-bottom))}
.tab{flex:1;background:none;border:none;padding:8px 2px;cursor:pointer;color:var(--dim);
  font-family:inherit;font-size:11px;font-weight:560;letter-spacing:.02em}
.tab.on{color:var(--accent)}

.swaplink{width:100%;margin-top:14px;background:transparent;border:none;color:var(--cool);
  border-radius:12px;padding:13px;font-size:13.5px;cursor:pointer;font-family:inherit}
.swapbox{margin-top:14px;background:var(--deep);border-radius:16px;padding:17px}
.swapbox .lbl{display:block;margin-bottom:11px}
.swaprow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  background:var(--raised);border:none;border-radius:13px;padding:15px 16px;margin-bottom:8px;
  cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:450;color:var(--ink);text-align:left}
.swaprow i{font-style:normal;font-size:11.5px;color:var(--cool);flex:0 0 auto;font-weight:560}
.swapclose{width:100%;background:transparent;border:none;color:var(--dim);padding:11px;
  font-size:13px;cursor:pointer;font-family:inherit}

[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>

function frame(p,shift){
  const t=shift?' transform="translate(105,0)"':'';
  let s='<g'+t+'><line x1="6" y1="96" x2="94" y2="96" stroke="#242932" stroke-width="1.5"/>';
  (p.props||[]).forEach(o=>{
    if(o.r) s+='<rect x="'+o.r[0]+'" y="'+o.r[1]+'" width="'+o.r[2]+'" height="'+o.r[3]+'" fill="#1C2027" rx="1.5"/>';
    if(o.l) s+='<line x1="'+o.l[0]+'" y1="'+o.l[1]+'" x2="'+o.l[2]+'" y2="'+o.l[3]+'" stroke="#39414C" stroke-width="2"/>';
  });
  const d=(pts,w,c)=>'<polyline points="'+pts.map(a=>a.join(',')).join(' ')+'" fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>';
  (p.back||[]).forEach(l=>s+=d(l,2.4,'#4A525E'));
  s+=d(p.spine,3.4,'#F4F6FA');
  (p.limbs||[]).forEach(l=>s+=d(l,3,'#F4F6FA'));
  s+='<circle cx="'+p.head[0]+'" cy="'+p.head[1]+'" r="5.4" fill="#F4F6FA"/>';
  (p.loads||[]).forEach(o=>s+='<rect x="'+(o[0]-3.5)+'" y="'+(o[1]-3.5)+'" width="7" height="7" rx="1.5" fill="#FF9F45"/>');
  (p.marks||[]).forEach(o=>s+='<circle cx="'+o[0]+'" cy="'+o[1]+'" r="7" fill="none" stroke="#FF9F45" stroke-width="1.5" stroke-dasharray="3 2.5"/>');
  return s+'</g>';
}
function diagram(d){
  if(!d) return '';
  return '<div class="diagram"><svg viewBox="0 0 205 104" role="img" aria-label="'+d.alt+'">'

    +'<div class="dcap"><span>'+d.ca+'</span><span>'+d.cb+'</span></div></div>';
}

// Three-layer persistence. window.storage when it exists, localStorage when the
// file is opened from the home screen, memory as the last resort. Without this,
// every weight and every logged session vanishes when the app is closed.
const PKEY='six-month';

/* ============================================================
   DURABLE STORAGE
   Four independent layers, written on every save, read newest-wins.
   Plus rolling snapshots so a single bad write can never take the
   history with it, and a persistence request that asks the OS not
   to evict this data under storage pressure.
   ============================================================ */
let storageState={persisted:false,layers:[],lastSave:null,snaps:[]};

function idb(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej('no idb');
    const r=window.indexedDB.open('sixmonth-db',1);
    r.onupgradeneeded=()=>{ const db=r.result;
      if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function idbPut(k,v){
  return idb().then(db=>new Promise((res,rej)=>{
    const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k);
    t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error);
  }));
}
function idbGet(k){
  return idb().then(db=>new Promise((res,rej)=>{
    const t=db.transaction('kv','readonly'); const q=t.objectStore('kv').get(k);
    q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error);
  }));
}
function idbKeys(){
  return idb().then(db=>new Promise((res,rej)=>{
    const t=db.transaction('kv','readonly'); const q=t.objectStore('kv').getAllKeys();
    q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error);
  }));
}

async function askPersist(){
  try{
    if(navigator.storage && navigator.storage.persist){
      if(navigator.storage.persisted && await navigator.storage.persisted()){
        storageState.persisted=true; return;
      }
      storageState.persisted = await navigator.storage.persist();
    }
  }catch(e){}
}

function payload(){
  return JSON.stringify({v:2,t:Date.now(),
    startISO,att,log,wts,body,reps,vols,progd,swaps,who,place});
}

let saveTimer=null, lastSnap=0, saveSeq=0, saveChain=Promise.resolve();
async function save(){ // debounced so rapid taps do not thrash storage
  clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave,220);
}
// Writes are serialized and sequence-guarded: a slow write that started
// earlier can never land on top of newer data.
function doSave(){
  const seq=++saveSeq;
  saveChain=saveChain.then(()=>writeAll(seq)).catch(()=>{});
  return saveChain;
}
async function writeAll(seq){
  if(seq!==saveSeq) return;            // superseded before it began
  const data=payload(); const layers=[];
  try{ if(window.localStorage){ window.localStorage.setItem(PKEY,data); layers.push('browser'); } }catch(e){}
  try{ await idbPut(PKEY,data); layers.push('database'); }catch(e){}
  try{ if(window.storage&&window.storage.set){ await window.storage.set(PKEY,data); layers.push('cloud'); } }catch(e){}
  // rolling snapshot at most every 10 minutes, keep the last 8
  const now=Date.now();
  if(now-lastSnap>6e5){
    lastSnap=now;
    try{
      await idbPut('snap:'+now,data);
      const keys=(await idbKeys()).filter(k=>String(k).indexOf('snap:')===0).sort();
      while(keys.length>8){ const old=keys.shift();
        const db=await idb(); const t=db.transaction('kv','readwrite');
        t.objectStore('kv').delete(old); }
    }catch(e){}
  }
  storageState.layers=layers; storageState.lastSave=now;
}

function parseSafe(raw){
  if(!raw) return null;
  try{ const d=JSON.parse(raw); return (d&&typeof d==='object')?d:null; }catch(e){ return null; }
}
function apply(d){
  if(!d) return false;
  startISO=d.startISO||null; att=d.att||{}; log=d.log||{}; wts=d.wts||{};
  body=d.body||[]; reps=d.reps||{}; vols=d.vols||{}; progd=d.progd||{}; swaps=d.swaps||{}; who=d.who||''; place=d.place||'the gym';
  return true;
}

async function loadState(){
  const cands=[];
  try{ const r=await window.storage.get(PKEY); if(r&&r.value) cands.push(parseSafe(r.value)); }catch(e){}
  try{ if(window.localStorage) cands.push(parseSafe(window.localStorage.getItem(PKEY))); }catch(e){}
  try{ cands.push(parseSafe(await idbGet(PKEY))); }catch(e){}
  // if every live layer is empty or corrupt, fall back to the newest snapshot
  let best=cands.filter(Boolean).sort((a,b)=>(b.t||0)-(a.t||0))[0];
  if(!best){
    try{
      const keys=(await idbKeys()).filter(k=>String(k).indexOf('snap:')===0).sort();
      for(let i=keys.length-1;i>=0 && !best;i--) best=parseSafe(await idbGet(keys[i]));
    }catch(e){}
  }
  apply(best);
  if(!startISO) startISO=isoOf(startMonday());
  // Migration: an earlier build defaulted the start date to the CURRENT Monday,
  // which retroactively marked days you were never meant to train. If nothing has
  // ever been logged, that date is a default rather than a decision — move it.
  const everTrained=Object.keys(att).some(k=>att[k]==='did');
  const t0=new Date(); t0.setHours(0,0,0,0);
  if(!everTrained && new Date(startISO+'T00:00:00') < t0){ startISO=isoOf(startMonday()); }
  try{
    const keys=(await idbKeys()).filter(k=>String(k).indexOf('snap:')===0).sort().reverse();
    storageState.snaps=keys.slice(0,8);
  }catch(e){}
  askPersist();
  await doSave();
}

function makeCode(){
  try{
    const raw=payload();
    // to base64 without choking on unicode
    const b=btoa(unescape(encodeURIComponent(raw)));
    return 'GS1-'+b;
  }catch(e){ return ''; }
}
function readCode(code){
  try{
    const b=String(code).trim().replace(/^GS1-/,'').replace(/\s+/g,'');
    const raw=decodeURIComponent(escape(atob(b)));
    const d=parseSafe(raw);
    if(!d) return false;
    apply(d); doSave(); return true;
  }catch(e){ return false; }
}

async function restoreSnap(key){
  try{ const d=parseSafe(await idbGet(key)); if(d){ apply(d); doSave(); return true; } }catch(e){}
  return false;
}

const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function mondayOf(d){ const x=new Date(d); const g=(x.getDay()+6)%7; x.setDate(x.getDate()-g); x.setHours(0,0,0,0); return x; }
// A fresh install starts on the NEXT Monday, never a past one. Defaulting to the
// current week retroactively marked days you were never meant to train.
function startMonday(){
  const t=new Date(); t.setHours(0,0,0,0);
  if(t.getDay()===1) return t;
  const x=new Date(t); x.setDate(x.getDate()+((8-x.getDay())%7||7)); x.setHours(0,0,0,0); return x;
}
function dateOf(week,dayI){ const s=new Date(startISO+'T00:00:00'); s.setDate(s.getDate()+(week-1)*7+dayI); return s; }
function currentWeek(){
  const s=new Date(startISO+'T00:00:00'), n=new Date(); n.setHours(0,0,0,0);
  return Math.floor((n-s)/(7*864e5))+1;
}
function blockFor(w){
  for(const b of BLOCKS){ if(w>=b.weeks[0]&&w<=b.weeks[1]) return b; }
  return w<1?BLOCKS[0]:BLOCKS[2];
}
function activeBlock(){ return blockOverride ? BLOCKS[blockOverride-1] : blockFor(currentWeek()); }
const mmss=s=>Math.floor(s/60)+':'+pad(s%60);
const todayIdx=()=>({1:0,2:1,3:2,4:3,5:4,6:5,0:6})[new Date().getDay()];
const W=n=>'https://www.youtube.com/results?search_query='+encodeURIComponent(n+' proper form technique');

function resolve(it){
  if(it.ex){
    const base=EX[it.ex], si=swaps[it.ex];
    const a=(si!==undefined && base.alts && base.alts[si]) ? base.alts[si] : null;
    return {
      name: a? a.n : base.n,
      fig:  a? (a.fig||null) : base.fig,
      cue:  a? a.cue : base.cue,
      steps:a? a.s : base.s,
      log:base.log, inc:base.inc, unit:a?null:base.unit, noload:base.noload,
      scheme:it.sch, sets:it.sets, rest:it.rest, block:it.blk,
      key: a? it.ex+':'+si : it.ex,     // swapped variants keep their own weight
      exk: it.ex, alts: base.alts||null, swapped: a? si : null, baseName: base.n
    };
  }
  return {name:it.n,cue:it.cue,steps:it.steps,scheme:it.sch,sets:it.sets||1,rest:it.rest||0,
    block:it.blk,heat:it.heat,skin:it.skin,key:it.n,noload:1};
}

/* ===== session shaping ===== */
// The 15-minute version: warm-up, the two lifts that matter, heat. Missing a
// session entirely costs far more than doing a short one.
function curItems(day){
  if(!day.items) return [];
  if(!shortMode) return day.items;
  return day.items.filter(raw=>{
    const b=(raw.blk||'')+'';
    return b.indexOf('Warm')===0 || b.indexOf('Block A')===0 || b.indexOf('Recovery')===0 || b.indexOf('Setup')===0;
  });
}

/* ===== rep tracking ===== */
function targetReps(scheme){
  const m=String(scheme).match(/(\d+)\s*[–-]\s*(\d+)/);
  if(m) return +m[2];
  const s2=String(scheme).match(/×\s*(\d+)/);
  return s2? +s2[1] : 8;
}
function rkey(w,di,k){ return w+'|'+di+'|'+k; }
function getReps(w,di,k,sets,scheme){
  const a=reps[rkey(w,di,k)];
  if(a) return a;
  return Array(sets).fill(targetReps(scheme));
}
function setReps(w,di,k,arr){ reps[rkey(w,di,k)]=arr; save(); }
function sessionVolume(blk,day,di,w){
  let v=0;
  curItems(day).forEach((raw,i)=>{
    const x=resolve(raw);
    if(x.sets<2||x.noload) return;
    const wt=todayW(x.key,blk,w); if(!wt) return;
    const r=getReps(w,di,x.key,x.sets,x.scheme);
    const n=done[i]||0;
    for(let j=0;j<n;j++) v+=wt*(r[j]||0);
  });
  return v;
}

/* ===== load engine ===== */
const round5 = n => Math.max(5, Math.round(n/5)*5);
function getW(key){ return wts[key] ? wts[key].w : null; }
function setW(key,v){
  if(!v){ delete wts[key]; }
  else { const prev=wts[key]||{}; wts[key]=Object.assign({},prev,{w:round5(+v)});
         if(prev.start===undefined) wts[key].start=round5(+v); }
  save();
}
// what to actually put on the bar today, accounting for deload weeks
function todayW(key,blk,w){
  const base=getW(key); if(!base) return null;
  if(blk.deload && w===blk.deload) return round5(base*0.6);
  return base;
}
// after a completed lift: did it go well, and what happens next time
function progress(key,outcome,blk){
  const rec=wts[key]; if(!rec) return;
  const bk=String(key).split(':')[0];
  const inc=(EX[bk]&&EX[bk].inc)||5;
  rec.hist=(rec.hist||[]).concat([rec.w]).slice(-14);
  if(outcome==='solid'){ rec.w=round5(rec.w+inc); rec.miss=0; }
  else if(outcome==='barely'){ rec.miss=0; }              // hold, earn it next time
  else { rec.miss=(rec.miss||0)+1;
         if(rec.miss>=2){ rec.w=round5(rec.w*0.9); rec.miss=0; rec.cut=1; } }
  rec.last=Date.now(); save();
}
function nextWord(key,blk){
  const rec=wts[key]; if(!rec) return '';
  const inc=(EX[String(key).split(':')[0]]&&EX[String(key).split(':')[0]].inc)||5;
  if(blk.id===3) return 'Block 3: hold this weight. Keeping it while eating less IS the win.';
  return 'Clear all sets and next time is '+round5(rec.w+inc)+' lb.';
}

/* ============ timers ============ */
let restEnd=0, restFired=false;
function clearRest(){ if(restId){clearInterval(restId);restId=null;} restLeft=0; restEnd=0; }
function startRest(sec){
  clearRest(); if(!sec)return;
  restEnd=Date.now()+sec*1000; restFired=false; restLeft=sec;
  restId=setInterval(tickRest,250); paintRest();
}
function tickRest(){
  restLeft=Math.max(0,Math.ceil((restEnd-Date.now())/1000));
  if(restLeft<=0 && !restFired){
    restFired=true;
    if(navigator.vibrate) navigator.vibrate([90,60,90]);
    clearInterval(restId); restId=null;
  }
  paintRest();
}
function paintRest(){ const b=document.getElementById('rest'); if(!b)return;
  b.hidden=restLeft<=0; const n=document.getElementById('restnum'); if(n)n.textContent=mmss(Math.max(restLeft,0)); }
let heatEnd=0;
function clearHeat(){ if(heatId){clearInterval(heatId);heatId=null;} heatLeft=0; heatEnd=0; }
function toggleHeat(sec){
  if(heatId){ clearInterval(heatId); heatId=null; paintHeat(sec); return; }   // pause
  if(heatLeft<=0) heatLeft=sec;
  heatEnd=Date.now()+heatLeft*1000;
  heatId=setInterval(()=>{
    heatLeft=Math.max(0,Math.ceil((heatEnd-Date.now())/1000));
    if(heatLeft<=0){ clearInterval(heatId); heatId=null;
      if(navigator.vibrate) navigator.vibrate([120,80,120,80,120]); }
    paintHeat(sec);
  },250);
  paintHeat(sec);
}
function paintHeat(sec){ const b=document.getElementById('heat'); if(!b)return;
  b.textContent=heatId?'Pause · '+mmss(heatLeft):(heatLeft>0?'Resume · '+mmss(heatLeft):'Start '+mmss(sec)); }
function startClock(){ if(startedAt)return; startedAt=Date.now(); tickId=setInterval(paintClock,1000); paintClock(); }
function paintClock(){ if(!startedAt){clockEl.textContent='';return;}
  const s=Math.floor((Date.now()-startedAt)/1000);
  clockEl.textContent=mmss(s)+' / 30:00'; clockEl.className='clock '+(s>1800?'over':'live'); }

/* ============ shell ============ */
function buildRail(){
  rail.innerHTML='';
  activeBlock().days.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='day'; b.textContent=d.tab; b.setAttribute('role','tab');
    b.addEventListener('click',()=>{ selectDay(i); itemIdx=0; if(view!=='session') setView('session'); });
    rail.appendChild(b);
  });
}
function selectDay(i){
  clearRest(); clearHeat();
  dayIdx=i; itemIdx=0;
  const d=activeBlock().days[i];
  done=curItems(d).map(()=>0); skin=SKIN.map(()=>false);
  const w=currentWeek();
  marked = att[w+'|'+i]==='did';
  [...rail.children].forEach((b,n)=>b.setAttribute('aria-selected',n===i));
  if(rail.children[i]) rail.children[i].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  render();
}
function setView(v){
  if(v!=='session'){ clearRest(); clearHeat(); }
  keepAwake(v==='session');
  view=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view===v||(v==='session'&&t.dataset.view==='today')));
  rail.hidden = v!=='session';
  headEl.hidden = v!=='session';
  render(); window.scrollTo({top:0});
}

 ['Same animal. Different beast.',''],

function quoteToday(){
  const d=new Date(), n=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
  return QUOTES[n%QUOTES.length];
}

function ring(pct,size,stroke,color){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" class="ring">'+
   '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--hair2)" stroke-width="'+stroke+'"/>'+
   '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'"'+
   ' stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct))+'"'+
   ' transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>';
}

function weekDone(w){ let c=0; for(let i=0;i<6;i++) if(att[w+'|'+i]==='did') c++; return c; }
function streakWeeks(){
  const cw=currentWeek(); let n=0;
  for(let w=Math.min(cw,TOTAL_WEEKS); w>=1; w--){
    if(weekDone(w)>=4) n++; else if(w<cw) break;
  }
  return n;
}
// Total pounds added across every lift since you started. This number moves
// every single week, including the weeks the mirror does not. It is the
// antidote to "I see no progress so why bother".
function strengthAdded(){
  let t=0; Object.keys(wts).forEach(k=>{ const r=wts[k];
    if(r && r.start!==undefined) t+=Math.max(0,r.w-r.start); });
  return t;
}
function bestStreak(){
  let best=0,run=0;
  for(let w=1;w<=TOTAL_WEEKS;w++){ if(weekDone(w)>=4){run++; if(run>best)best=run;} else run=0; }
  return best;
}
// Was the most recent scheduled day missed? Used to offer a re-entry, not a scolding.
// Only speaks up if you have actually been training and then dropped off.
// It never greets a brand new user with a failure.
function recentMiss(){
  const cw=currentWeek(); if(cw<1||cw>TOTAL_WEEKS) return null;
  if(!Object.keys(att).some(k=>att[k]==='did')) return null;
  for(let back=1;back<=3;back++){
    const di=todayIdx()-back;
    if(di<0||di>5) continue;
    if(!att[cw+'|'+di]) return DAYNAMES[di];
  }
  return null;
}
function leaveIn(){
  const d=new Date(), mins=(7*60+30)-(d.getHours()*60+d.getMinutes());
  if(mins<=0||mins>150) return null;
  return mins;
}

function weekStrip(w){
  if(w<1||w>TOTAL_WEEKS) return '<p class="empty">Set your start date in Setup and this fills in.</p>';
  let h='<div class="ghead" style="grid-template-columns:repeat(7,1fr)">'+DAYNAMES.map(x=>'<span>'+x[0]+'</span>').join('')+'</div>'+
        '<div class="wk" style="grid-template-columns:repeat(7,1fr)">';
  for(let i=0;i<7;i++){
    const st=cellState(w,i);
    const isToday=i<6 && isoOf(dateOf(w,i))===isoOf(new Date());
    h+='<div class="cell '+st+(isToday?' today':'')+'">'+(st==='did'?'✓':(st==='miss'?'✕':''))+'</div>';
  }
  return h+'</div>';
}

function render(){

  if(view==='track') return renderTrack();

  if(view==='log') return renderLog();

  const lk=it.key;
  const wNow = it.noload ? null : todayW(lk,blk,w);

  let weightUI='';
  if(it.sets>1 && !it.noload){
    if(wNow===null || editing===it.key){
      const cur=getW(it.key);
      weightUI='<div class="wsetup"><div class="wq">'+(cur?'Change the weight':'What weight will you use?')+'</div>'+
        '<p class="whelp">Pick something you could do these reps with about 2 left in the tank. Guess low — it goes up every session you clear.</p>'+
        '<button class="helpme" id="helpme">Not sure? Work it out for me</button>'+
        (helping===it.key? '<div class="estbox"><p>What weight could you do for a clean set of 10?</p>'+
          '<div class="winput"><input id="est" type="number" inputmode="decimal" placeholder="0">'+
          '<button id="estgo">Use it</button></div>'+
          '<p class="esthelp">I will take about 75% of that as your starting weight — deliberately conservative for week one.</p></div>':'')+
        '<div class="winput"><input id="wnew" type="number" inputmode="decimal" placeholder="0" value="'+(cur||'')+'">'+
        '<span>lb'+(it.unit?' · '+it.unit:'')+'</span><button id="wsave">Save</button></div>'+
        (cur?'<button class="cancel" id="wcancel">Cancel</button>':'')+'</div>';
    } else {
      const dl = blk.deload && w===blk.deload;
      weightUI='<div class="wbig"><div class="wnum">'+wNow+'<span>lb</span></div>'+
        '<div class="wmeta"><div class="wevery">Every set'+(it.unit?' · '+it.unit:'')+'</div>'+
        '<div class="wnote">'+(dl?'Deload week — 60% of your usual '+getW(lk)+' lb':nextWord(lk,blk))+'</div></div>'+
        '<button class="wedit" id="wedit">Change</button></div>';
    }
  }

  let repUI='';
  if(it.sets>1 && !it.noload && wNow!==null && done[itemIdx]>0){
    const arr=getReps(w,dayIdx,it.key,it.sets,it.scheme);
    let vol=0; for(let j=0;j<done[itemIdx];j++) vol+=wNow*(arr[j]||0);
    repUI='<div class="reps"><div class="repshead"><span class="lbl">Reps you actually got</span>'+

      Array.from({length:done[itemIdx]},(_,j)=>
        '<div class="reprow"><span class="rlbl">Set '+(j+1)+'</span>'+
        '<button class="rbtn" data-r="'+j+'" data-d="-1">−</button>'+
        '<span class="rnum">'+arr[j]+'</span>'+

      '</div>';
  }

  const pdk = w+'|'+dayIdx+'|'+it.key;
  const alreadyRated = !!progd[pdk];
  let prompt='';
  if(allDone && !it.noload && wNow!==null && !(blk.deload&&w===blk.deload)){
    prompt = alreadyRated
      ? '<div class="prompt"><div class="rated"><b>'+progd[pdk].msg+'</b>'+
        '<button class="undo" id="undo">Undo</button></div></div>'

    '</span><span class="chev">›</span></button>'
   : '<div class="next"><span class="nextlbl">End</span><span class="nextbody"><span class="nextname">Session complete</span>'+
     '<span class="nextscheme">Shower, skin routine, work</span></span></div>';

  const jumpList = jumping ? '<div class="jumplist">'+items.map((raw,i)=>{
      const x=resolve(raw);
      return '<button class="jrow'+(i===itemIdx?' on':'')+'" data-jump="'+i+'">'+
        '<span class="jn">'+(i+1)+'</span><span class="jname">'+x.name+'</span>'+
        '<span class="jsch">'+x.scheme+'</span></button>';
    }).join('')+'</div>' : '';

  stage.innerHTML=jumpList+(shortMode?'<div class="shortbar">Short version · warm-up, two lifts, heat <button id="shoff">Full session</button></div>':'')+
    '<section class="now"><div class="nowtop"><span class="step">'+(itemIdx+1)+' of '+items.length+'</span>'+
    '<span class="blocktag">'+it.block+'</span></div><h2 class="exname">'+it.name+'</h2>'+
    '<div class="scheme">'+it.scheme+'</div>'+diagram(FIG[it.fig])+howto+
    '<p class="cue">'+it.cue+'</p>'+swapUI+dl+watch+weightUI+pips+repUI+prompt+rest+heat+skinBox+'</section>'+next+
    '<div class="nav"><button id="back">'+(itemIdx===0?'Overview':'Back')+'</button>'+
    '<button class="go" id="fwd"'+(itemIdx===items.length-1?' disabled':'')+'>Next up</button></div>'+
    (itemIdx===items.length-1?summary(blk,day,w):'');

  stage.querySelectorAll('.pip').forEach(p=>p.addEventListener('click',()=>{
    const n=+p.dataset.set; done[itemIdx]=(done[itemIdx]===n)?n-1:n;

  }));

    skin[+b.dataset.skin]=!skin[+b.dataset.skin]; render();
  }));
  const ws=document.getElementById('wsave');
  if(ws) ws.addEventListener('click',()=>{
    const v=document.getElementById('wnew').value;
    if(v){ setW(it.key,v); editing=null; render(); }

  const hm=document.getElementById('helpme');
  if(hm) hm.addEventListener('click',()=>{ helping=(helping===it.key?null:it.key); render(); });

  if(eg) eg.addEventListener('click',()=>{
    const v=+document.getElementById('est').value;
    if(v>0){ setW(it.key, Math.max(5,v*0.75)); helping=null; editing=null; render(); }
  });
  const wc=document.getElementById('wcancel');
  if(wc) wc.addEventListener('click',()=>{ editing=null; render(); });

    const after=getW(it.key);
    const msg = after>before ? 'Going up to '+after+' lb next session'
              : after<before ? 'Dropped to '+after+' lb — build it back'
              : 'Staying at '+after+' lb next session';
    progd[pdk]={out:out,msg:msg,prev:before}; save();
    if(navigator.vibrate) navigator.vibrate(25);
    render();
  }));
  const un=document.getElementById('undo');
  if(un) un.addEventListener('click',()=>{
    const p=progd[pdk];
    if(p){ wts[it.key].w=p.prev; delete progd[pdk]; save(); render(); }

  document.getElementById('fwd').addEventListener('click',()=>go(1));
  const so2=document.getElementById('swapopen');
  if(so2) so2.addEventListener('click',()=>{ swapOpen=it.exk; render(); });
  const sx=document.getElementById('swapx');
  if(sx) sx.addEventListener('click',()=>{ swapOpen=null; render(); });
  stage.querySelectorAll('[data-swap]').forEach(b=>b.addEventListener('click',()=>{
    const v=+b.dataset.swap;
    if(v<0) delete swaps[it.exk]; else swaps[it.exk]=v;
    swapOpen=null; save(); render();
  }));
  const jp=document.getElementById('jump');
  if(jp) jp.addEventListener('click',()=>{ jumping=!jumping; render(); });
  stage.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>{
    itemIdx=+b.dataset.jump; jumping=false; clearRest(); clearHeat(); render();
    window.scrollTo({top:0,behavior:'smooth'});
  }));
  const so=document.getElementById('shoff');
  if(so) so.addEventListener('click',()=>{ shortMode=false; selectDay(dayIdx); setView('session'); });
  wireMark(); paintRest();
}
function summary(blk,day,w){
  const vol=sessionVolume(blk,day,dayIdx,w);
  const its=curItems(day);
  let setsDone=0; done.forEach((n,i)=>{ if(!its[i])return; const x=resolve(its[i]); if(x.sets>1) setsDone+=n; });
  const mins=startedAt?Math.round((Date.now()-startedAt)/60000):0;
  return '<div class="summary"><span class="lbl">Session summary</span>'+
   '<div class="sumgrid">'+
    '<div><b>'+setsDone+'</b><i>sets done</i></div>'+
    '<div><b>'+(vol?Math.round(vol/1000)+'k':'0')+'</b><i>lb lifted</i></div>'+
    '<div><b>'+mins+'</b><i>minutes</i></div>'+
   '</div>'+markBtn()+'</div>';
}
function markBtn(){
  if(dayIdx===6) return '';
  return '<button class="done'+(marked?' marked':'')+'" id="mark">'+(marked?'✓ Logged for this week':'Mark this session done')+'</button>';
}
function wireMark(){
  const b=document.getElementById('mark'); if(!b)return;
  b.addEventListener('click',()=>{
    const w=currentWeek(); if(w<1||w>TOTAL_WEEKS) return;
    const k=w+'|'+dayIdx;
    if(att[k]==='did'){ delete att[k]; marked=false; delete vols[k]; }
    else { att[k]='did'; marked=true;
           const bd=activeBlock().days[dayIdx];
           if(bd.items) vols[k]=Math.round(sessionVolume(activeBlock(),bd,dayIdx,w)); }
    save(); render();
  });
}
function go(d){
  const items=curItems(activeBlock().days[dayIdx]), t=itemIdx+d;
  if(t<0||t>=items.length) return;
  clearRest(); clearHeat(); editing=null; jumping=false; itemIdx=t; render(); window.scrollTo({top:0,behavior:'smooth'});
}

/* ============ track view ============ */
// Four honest states. A day you simply have not logged is 'open' — neutral,
// not a failure. Nothing counts as missed unless you mark it that way.
function cellState(week,di){
  const k=week+'|'+di;
  if(di===6) return 'rest';
  if(att[k]) return att[k];
  const d=dateOf(week,di), t=new Date(); t.setHours(0,0,0,0);
  const st=new Date(startISO+'T00:00:00');
  if(d<st) return 'pre';
  if(d<t) return 'open';
  return 'future';
}
function elapsedSessions(){ // scheduled days that have actually come and gone
  let n=0;
  for(let w=1;w<=TOTAL_WEEKS;w++) for(let i=0;i<6;i++){
    const s=cellState(w,i);
    if(s==='did'||s==='miss'||s==='open') n++;
  }
  return n;
}
function renderTrack(){
  const cw=currentWeek(), started=cw>=1;
  let didN=0, missN=0;
  for(let w=1;w<=TOTAL_WEEKS;w++) for(let d=0;d<6;d++){
    const s=cellState(w,d);
    if(s==='did') didN++; else if(s==='miss') missN++;
  }
  const elapsed=elapsedSessions();
  const rate = elapsed ? Math.round(didN/elapsed*100) : null;
  const streak=streakWeeks();

  const showAll = gridAll || !started;
  const blkNow = blockFor(started?cw:1);
  const wFrom = showAll?1:blkNow.weeks[0], wTo = showAll?TOTAL_WEEKS:blkNow.weeks[1];
  let grid='<div class="grid"><div class="ghead"><span></span>'+DAYNAMES.map(d=>'<span>'+d[0]+'</span>').join('')+'</div>';
  for(let w=wFrom;w<=wTo;w++){
    const blk=blockFor(w), isDl=blk.deload===w;
    grid+='<div class="wk'+(w===cw?' now':'')+(isDl?' deloadrow':'')+'"><span class="wklbl">'+w+(isDl?' D':'')+'</span>';
    for(let d=0;d<7;d++){
      const st=cellState(w,d);
      const isToday = d<6 && isoOf(dateOf(w,d))===isoOf(new Date());
      const mark = st==='did'?'✓':(st==='miss'?'✕':'');
      grid+='<button class="cell '+st+(isToday?' today':'')+'" data-w="'+w+'" data-d="'+d+'">'+mark+'</button>';
    }
    grid+='</div>';
  }
  grid+='</div><button class="gridtoggle" id="gtog">'+
    (showAll?'Show only Block '+blkNow.id:'Show all 26 weeks')+'</button>';

  stage.innerHTML=
   (started && (cw>1 || Object.keys(att).length) ? recap(cw>1?cw-1:cw) : '')+
   '<div class="stats">'+
     '<div class="stat"><div class="statn" style="color:var(--good)">'+didN+'</div><div class="statl">Sessions done</div></div>'+
     '<div class="stat"><div class="statn">'+(!elapsed?'—':rate+'%')+'</div><div class="statl">Adherence</div></div>'+
     '<div class="stat"><div class="statn" style="color:var(--amber)">'+(started?streak:'—')+'</div><div class="statl">Week streak</div></div>'+
     '<div class="stat"><div class="statn" style="color:var(--dawn)">'+(started?Math.max(0,TOTAL_WEEKS-cw+1):TOTAL_WEEKS)+'</div><div class="statl">Weeks left</div></div>'+
   '</div>'+
   (started? '' : '<div class="panel"><h2>Not started yet</h2><p>Your program begins '+
     FULLDAYS[new Date(startISO+"T00:00:00").getDay()]+', '+
     MONTHS[new Date(startISO+"T00:00:00").getMonth()]+' '+new Date(startISO+"T00:00:00").getDate()+
     '. Nothing counts until then — the grid below is your whole six months, waiting.</p></div>')+
   '<div class="panel"><h2>'+(started?'Your weeks':'Six months, waiting')+'</h2>'+
   '<p>Tap a square to mark it. Blank means not logged — that is neutral, not a failure. Nothing here counts against you unless you mark it missed yourself.</p>'+grid+
   '<div class="legend">'+
     '<div><span class="sw" style="background:var(--good);border-color:var(--good)"></span>Done</div>'+
     '<div><span class="sw" style="background:var(--miss);border-color:var(--miss)"></span>Marked missed</div>'+
     '<div><span class="sw"></span>Not logged</div>'+
     '<div><span class="sw" style="border-style:dashed"></span>Sunday rest</div>'+
     '<div><span class="sw" style="border-left:2px solid var(--dawn)"></span>Deload week</div>'+
   '</div></div>'+
   (started?progressPanel():'')+
   renderBody()+
   '<div class="panel"><h2>What counts as on track</h2>'+
   '<p><strong>Four of six sessions a week</strong> keeps the program working. Six is the plan, five is normal, four is fine. Three for two weeks running is the only signal worth reacting to.</p>'+
   '<p>Best run so far: <strong>'+bestStreak()+' weeks</strong>. A broken streak never erases that.</p>'+
   '<p>Roughly half of people who start a training program stop inside six months, and the trigger is usually one missed session turning into a written-off week. That is why this counts weeks rather than days, and why it never asks you to make anything up.</p></div>';

  const gt=document.getElementById('gtog');
  if(gt) gt.addEventListener('click',()=>{ gridAll=!gridAll; renderTrack(); });
  const bs=document.getElementById('bsave');
  if(bs) bs.addEventListener('click',()=>{
    const bw=document.getElementById('bw').value, bwa=document.getElementById('bwa').value;
    if(!bw&&!bwa) return;
    const d=new Date();
    body.push({d:MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate(),w:bw||'—',wa:bwa||'—'});
    save(); renderTrack();
  });
  stage.querySelectorAll('.cell').forEach(c=>{
    if(c.classList.contains('rest')) return;
    c.addEventListener('click',()=>{
      const k=c.dataset.w+'|'+c.dataset.d, cur=att[k];
      if(!cur) att[k]='did'; else if(cur==='did') att[k]='miss'; else delete att[k];
      save(); renderTrack();
      if(+c.dataset.w===cw && +c.dataset.d===dayIdx) marked = att[k]==='did';
    });
  });
}
